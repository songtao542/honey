buildscript {
    apply from: 'versions.gradle'
    ext {
        kotlin_version = '1.5.31'
    }
    addRepos(repositories)
    dependencies {
        classpath deps.android_gradle_plugin
        classpath deps.kotlin.plugin
        classpath deps.kotlin.allopen
        classpath deps.kotlinx.serialization_plugin
        classpath deps.navigation.safe_args_plugin

        // Updated Jetifier version
        classpath "com.android.tools.build.jetifier:jetifier-processor:1.0.0-beta09"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

allprojects {
    addRepos(repositories)
    
    // Enable build optimizations for all projects
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "1.8"
            freeCompilerArgs += [
                "-Xopt-in=kotlin.RequiresOptIn",
                "-Xjvm-default=all"
            ]
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

repositories {
    maven {
        url 'http://www.idescout.com/maven/repo/'
        name 'IDEScout, Inc.'
    }
}
